name: aws-ecr Pipeline

on:
  push:
    branches:
      - aws-infra

env:
    REGION: eu-north-1
    ECR_REPO: infinitynevo/java-app

jobs:
  build:
    runs-on: self-hosted

    outputs:
      app_version: ${{ steps.version.outputs.app_version }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set app version
        id: version
        run: |
                APP_VERSION="1.0.$((GITHUB_RUN_NUMBER - 1))"
                echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
                echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Update Maven version
        run: mvn versions:set -DnewVersion=$APP_VERSION

      - name: Build Docker image
        run: docker build -t java-app:$APP_VERSION .

      - name: Login to ECR
        run: aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com

      - name: tag Docker image
        run: docker tag java-app:$APP_VERSION ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO:$APP_VERSION
      
      - name: Push Docker image to ECR
        run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO:$APP_VERSION


  deploy:
    needs: build
    runs-on: self-hosted

    env:
      APP_VERSION: ${{ needs.build.outputs.app_version }}

    steps:

      - name: Login to ECR
        run: aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com
      
      - name: Pull Docker image from ECR
        run: docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO:$APP_VERSION

      - name: Stop and remove existing container
        run: docker rm -f java-app-container || true

      - name: Run Docker container
        run: docker run --name java-app-container ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO:$APP_VERSION 